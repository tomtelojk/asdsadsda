name: Verificar CSharp
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./scripts/test.sh
      - name: Preparar display de teste
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Abrir fazenda e vila nativas
        run: |
          xvfb-run -a ./scripts/dotnet.sh src/ValeDoSol/bin/Release/net10.0/ValeDoSol.dll --smoke --save-dir "$RUNNER_TEMP/vale-farm"
          xvfb-run -a ./scripts/dotnet.sh src/ValeDoSol/bin/Release/net10.0/ValeDoSol.dll --smoke --village --save-dir "$RUNNER_TEMP/vale-village"
          xvfb-run -a ./scripts/dotnet.sh src/ValeDoSol/bin/Release/net10.0/ValeDoSol.dll --smoke --home --save-dir "$RUNNER_TEMP/vale-home"
          xvfb-run -a ./scripts/dotnet.sh src/ValeDoSol/bin/Release/net10.0/ValeDoSol.dll --smoke --shop --save-dir "$RUNNER_TEMP/vale-shop"
          for room in WORKSHOP BAKERY LIBRARY GREENHOUSE COTTAGE TOWNHALL; do
            xvfb-run -a ./scripts/dotnet.sh src/ValeDoSol/bin/Release/net10.0/ValeDoSol.dll --smoke --scene "$room" --save-dir "$RUNNER_TEMP/vale-$room"
          done
