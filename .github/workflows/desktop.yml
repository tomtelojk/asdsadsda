name: Publicar CSharp Linux
on:
  workflow_dispatch:
  push:
    tags: ['v3*']
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./scripts/package.sh
      - name: Testar o executável distribuído
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
          ./release/Vale-do-Sol-CSharp-3.0.0-Linux-x86_64 --self-test
          xvfb-run -a ./release/Vale-do-Sol-CSharp-3.0.0-Linux-x86_64 --smoke --save-dir "$RUNNER_TEMP/vale-published"
      - name: Publicar downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v3.0.0
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Vale do Sol 3.0 · C# para Linux" --notes-file docs/RELEASE.md
          fi
          gh release upload "$tag" release/Vale-do-Sol-CSharp-3.0.0-Linux-x86_64 release/*.tar.gz release/SHA256SUMS-CSharp --clobber
