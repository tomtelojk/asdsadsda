name: Publicar CSharp Linux
on:
  workflow_dispatch:
  push:
    tags: ['v8*']
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./scripts/package.sh
      - name: Testar o executável distribuído
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
          version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/ValeDoSol/ValeDoSol.csproj)
          binary="./release/Vale-do-Sol-CSharp-$version-Linux-x86_64"
          "$binary" --self-test
          xvfb-run -a "$binary" --smoke --save-dir "$RUNNER_TEMP/vale-farm"
          xvfb-run -a "$binary" --smoke --village --save-dir "$RUNNER_TEMP/vale-village"
          xvfb-run -a "$binary" --smoke --home --save-dir "$RUNNER_TEMP/vale-home"
          xvfb-run -a "$binary" --smoke --shop --save-dir "$RUNNER_TEMP/vale-shop"
          for room in WORKSHOP BAKERY LIBRARY GREENHOUSE COTTAGE TOWNHALL; do
            xvfb-run -a "$binary" --smoke --scene "$room" --save-dir "$RUNNER_TEMP/vale-$room"
          done
      - name: Publicar downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' src/ValeDoSol/ValeDoSol.csproj)
          tag="v$version"
          binary="release/Vale-do-Sol-CSharp-$version-Linux-x86_64"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Vale do Sol $version · A vila floresce" --notes-file docs/RELEASE.md
          fi
          gh release upload "$tag" "$binary" "$binary.tar.gz" release/SHA256SUMS-CSharp --clobber
